<style>

/* Pastel only. One full-screen 3D world with a floating HUD and a sheet (phone) or side panel (desktop). */
:root {
  --milk: #FFF8F1; --blush: #FFD6E2; --lilac: #DCD3F7; --mint: #CFEFE0; --butter: #FFEBA8; --sky: #CFE3FA;
  --ink: #3A2440; --ink-soft: #6A4E70; --cherry: #C23A63; --line: #3A2440; --dash: #D9C5D6;
  --display: "Bagel Fat One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --body: "Figtree Variable", "Figtree", ui-sans-serif, system-ui, sans-serif;
  --mono: "DM Mono", ui-monospace, Menlo, monospace;
  --hand: "Caveat", "Bradley Hand", "Comic Sans MS", cursive;
  color-scheme: light;
}
html, body { height: 100%; }
html { background: var(--milk); }
body { margin: 0; background: var(--milk); color: var(--ink); font-family: var(--body); font-size: 16px; overflow: hidden; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
html.scrollable body { overflow: auto; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--cherry); outline-offset: 3px; border-radius: 12px; }
.mono { font-family: var(--mono); font-size: 13px; letter-spacing: .04em; }

#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; background: radial-gradient(120% 90% at 50% 20%, #FFF1F5 0%, #FBE3EC 45%, #EEDFF7 100%); }
#flash { position: fixed; inset: 0; z-index: 6; pointer-events: none; background: radial-gradient(circle at 50% 45%, #fff 0%, #FFE3EC 40%, #E7DDFB 100%); transition: opacity .45s; }

/* HUD */
.hud { position: fixed; left: 0; right: 0; top: 0; z-index: 7; display: flex; justify-content: space-between; align-items: center; gap: 12px; pointer-events: none;
  padding: calc(12px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px)); }
.hud > * { pointer-events: auto; }
.brand { font-family: var(--display); font-size: 20px; line-height: 1; background: none; border: 0; padding: 8px 0; text-align: left; min-height: 44px; }
.brand small { display: block; font-family: var(--mono); font-size: 12px; letter-spacing: .06em; color: var(--ink-soft); margin-top: 4px; }
.hud-right { display: flex; gap: 8px; }
.pill { white-space: nowrap; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 2px solid var(--line); background: var(--milk); display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; text-decoration: none; color: var(--ink); box-shadow: 0 3px 0 var(--line); transition: transform .15s, box-shadow .15s; }
.pill:hover { transform: translateY(-1px); box-shadow: 0 4px 0 var(--line); }
.pill:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
.pill.cherry { background: var(--cherry); color: #fff; }
.pill.butter { background: var(--butter); }
.pill.big { min-height: 52px; padding: 0 26px; font-size: 18px; }
.pill.inline { margin-top: 10px; align-self: flex-start; }

/* Intro */
.intro { position: fixed; inset: 0; z-index: 4; display: flex; flex-direction: column; justify-content: space-between; align-items: center; text-align: center; pointer-events: none; transition: opacity .6s;
  padding: calc(86px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(28px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.intro > * { pointer-events: auto; }
.intro h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(42px, 9vw, 96px); line-height: .92; text-wrap: balance; }
.intro h1 em { font-style: normal; color: var(--cherry); }
.intro p { margin: 10px auto 0; max-width: 34ch; font-size: 17px; line-height: 1.45; color: var(--ink-soft); }
.intro .go { display: flex; flex-direction: column; align-items: center; gap: 6px; min-height: 100px; justify-content: flex-end; }
.intro .tiny { font-size: 14px; color: var(--ink-soft); background: none; border: 0; text-decoration: underline; min-height: 44px; padding: 0 12px; }
.intro .loading { background: var(--milk); border: 2px solid var(--line); border-radius: 999px; padding: 10px 16px; }
.hidden-fade { opacity: 0; pointer-events: none !important; }
.hidden-fade * { pointer-events: none !important; }

/* Dots on the objects */
#dots { position: fixed; inset: 0; z-index: 3; pointer-events: none; }
.dot { position: absolute; left: 0; top: 0; width: 44px; height: 44px; margin: -22px 0 0 -22px; border: 0; background: none; padding: 0; pointer-events: auto; display: flex; align-items: center; justify-content: center; }
.dot i { position: relative; display: block; width: 14px; height: 14px; border-radius: 50%; background: var(--cherry); border: 2px solid #fff; box-shadow: 0 0 0 2px var(--line); }
.dot i::after { content: ""; position: absolute; inset: -2px; border-radius: 50%; border: 2px solid var(--cherry); animation: ping 1.8s ease-out infinite; }
.dot span { pointer-events: none; position: absolute; left: 34px; top: 50%; transform: translateY(-50%); white-space: nowrap; background: var(--milk); border: 2px solid var(--line); border-radius: 999px; padding: 4px 10px; font-weight: 600; font-size: 14px; opacity: 0; transition: opacity .15s; box-shadow: 0 2px 0 var(--line); }
.dot:hover span, .dot:focus-visible span, .dot.show span { opacity: 1; }
.dot.done i { background: var(--butter); }
@keyframes ping { 0% { transform: scale(1); opacity: .9; } 100% { transform: scale(2.6); opacity: 0; } }


/* ───────── Room shelf: everything in the room, one tap away ───────── */
.shelf { position: fixed; left: 0; right: 0; bottom: 0; z-index: 4; padding: 0 0 calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
.shelf > * { pointer-events: auto; }
.shelf-hint { margin: 0; background: var(--milk); border: 2px solid var(--line); border-radius: 999px; padding: 6px 12px; max-width: calc(100% - 32px); text-align: center; }
.shelf-list { list-style: none; margin: 0; padding: 4px max(16px, env(safe-area-inset-left, 0px)) 6px; display: flex; gap: 8px; overflow-x: auto; max-width: 100%; scroll-snap-type: x proximity; scrollbar-width: none; }
.shelf-list::-webkit-scrollbar { display: none; }
.shelf-list li { flex: none; scroll-snap-align: start; }
.shelf-list button { min-height: 44px; padding: 0 14px; border-radius: 999px; border: 2px solid var(--line); background: var(--milk); font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; box-shadow: 0 3px 0 var(--line); }
.shelf-list button .mono { color: var(--cherry); font-size: 12px; }
.shelf-list button.seen { background: var(--butter); }
@media (min-width: 900px) { .shelf-list { justify-content: center; flex-wrap: wrap; max-width: 1100px; } }
.hud-hidden { opacity: 0; pointer-events: none !important; }
.hud-hidden * { pointer-events: none !important; }

/* ───────── The stage: each chapter is a full-screen scene that grows out of the object ───────── */
.stage, .stage-static { --bg: var(--milk); --fg: var(--ink); --soft: var(--ink-soft); --accent: var(--cherry); --card: #fff; --edge: var(--line); }
.stage {
  position: fixed; inset: 0; z-index: 8; display: flex; flex-direction: column; background: var(--bg); color: var(--fg);
  clip-path: circle(0px at var(--ox, 50%) var(--oy, 50%)); transition: clip-path .75s cubic-bezier(.7, 0, .2, 1); }
.stage.open { clip-path: circle(160vmax at var(--ox, 50%) var(--oy, 50%)); }
.stage-bar { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: calc(10px + env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) 8px max(12px, env(safe-area-inset-left, 0px)); }
.stage-count { margin: 0; font-size: 15px; font-weight: 500; color: var(--fg); }
.stage-count span { color: var(--soft); }
.progress { flex: none; height: 3px; margin: 0 max(12px, env(safe-area-inset-left, 0px)); background: color-mix(in srgb, var(--fg) 15%, transparent); border-radius: 3px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); transition: width .5s; }
.stage-scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
.stage-inner { max-width: 1000px; margin: 0 auto; padding: 18px max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px)); animation: rise .55s cubic-bezier(.2, .9, .2, 1) both; }
@keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
.stage-foot { flex: none; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 10px max(12px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); border-top: 2px dashed color-mix(in srgb, var(--fg) 18%, transparent); }
.pill.small { min-height: 44px; padding: 0 14px; font-size: 14px; }
.pill.round { width: 52px; min-height: 52px; padding: 0; font-size: 20px; }
.pill.next { min-height: 52px; flex: 1; max-width: 380px; justify-content: space-between; padding: 0 18px; font-size: 16px; }
.pill.next .mono { font-size: 12px; opacity: .85; }
.next-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* dark scenes */
.look-screening, .look-onair, .look-chalk, .look-neon, .look-forest, .look-lattice, .look-festival, .look-stars { --fg: #FFF3EA; --soft: #E7CFE0; --card: rgba(255, 255, 255, .07); --edge: rgba(255, 243, 234, .55); color-scheme: dark; }
:is(.look-screening, .look-onair, .look-chalk, .look-neon, .look-forest, .look-lattice, .look-festival, .look-stars) .pill:not(.cherry):not(.butter) { background: rgba(255, 255, 255, .1); color: var(--fg); border-color: var(--edge); box-shadow: none; }

/* shared chapter type */
.ch-head { margin: 4px 0 14px; }
.ch-kicker { margin: 0 0 6px; color: var(--accent); text-transform: uppercase; letter-spacing: .14em; }
.ch-title { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(40px, 11vw, 92px); line-height: .9; letter-spacing: -.01em; text-wrap: balance; }
.lede { margin: 0 0 14px; font-size: 17px; line-height: 1.55; max-width: 60ch; color: var(--fg); }
.lede.center { margin-inline: auto; text-align: center; }
.hand { font-family: var(--hand); font-size: 24px; line-height: 1.1; }
.big-hand { font-size: 34px; color: var(--accent); transform: rotate(-2deg); margin: 18px 0 0; }
.status { display: inline-flex; align-items: center; gap: 8px; margin: 0 0 12px; padding: 6px 12px; border-radius: 999px; border: 2px solid currentColor; font-size: 13px; text-transform: uppercase; letter-spacing: .1em; }
.status i { width: 9px; height: 9px; border-radius: 50%; background: #6FE3A6; box-shadow: 0 0 0 0 rgba(111, 227, 166, .7); animation: live 1.6s infinite; }
@keyframes live { 0% { box-shadow: 0 0 0 0 rgba(111, 227, 166, .7); } 100% { box-shadow: 0 0 0 10px rgba(111, 227, 166, 0); } }

/* video tiles (used inside scenes) */
.tile { display: flex; flex-direction: column; border: 2px solid var(--edge); border-radius: 18px; overflow: hidden; background: var(--card); min-width: 0; }
.tile .screen { position: relative; overflow: hidden; }
.tile.h .screen { aspect-ratio: 16 / 9; }
.tile.v .screen { aspect-ratio: 9 / 16; width: min(100%, calc(62vh * 9 / 16)); width: min(100%, calc(62dvh * 9 / 16)); margin: 0 auto; }
.screen iframe, .screen video { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #000; }
.screen video { object-fit: cover; cursor: pointer; }
.screen.coming { position: relative; display: flex; align-items: center; justify-content: center; color: var(--ink); }
.screen.coming .mono { background: #fff; border: 2px solid var(--line); border-radius: 999px; padding: 6px 12px; }
.screen-btn { position: absolute; inset: 0; width: 100%; height: 100%; padding: 0; border: 0; background: none; display: flex; align-items: center; justify-content: center; }
.screen-btn .poster, .poster { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.screen-btn b { position: relative; width: 60px; height: 60px; border-radius: 50%; background: #fff; color: var(--ink); border: 2px solid var(--line); display: flex; align-items: center; justify-content: center; font-size: 20px; padding-left: 4px; box-sizing: border-box; transition: transform .15s; }
.screen-btn:hover b { transform: scale(1.08); }
.tile .meta { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 3px; }
.tile .meta strong { font-size: 16px; line-height: 1.2; }
.tile .meta span { font-size: 13px; color: var(--soft); line-height: 1.35; }
.sound { position: absolute; right: 10px; bottom: 10px; z-index: 2; height: 44px; min-width: 44px; padding: 0 12px; border-radius: 999px; border: 2px solid var(--line); background: rgba(255, 248, 241, .92); color: var(--ink); display: inline-flex; align-items: center; justify-content: center; gap: 6px; box-shadow: 0 2px 0 var(--line); }
.sound.on { background: var(--butter); }
.sound.nudge { animation: nudge 1.6s ease-in-out infinite; }
.sound-tip { font-size: 13px; font-weight: 600; white-space: nowrap; }
@keyframes nudge { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.07); } }
.paused-badge { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 64px; height: 64px; border-radius: 50%; background: #fff; color: var(--ink); border: 2px solid var(--line); display: flex; align-items: center; justify-content: center; font-size: 22px; padding-left: 4px; box-sizing: border-box; pointer-events: none; }
.photo { margin: 0; }
.photo img { display: block; width: 100%; height: auto; border-radius: 14px; background: #fff; }

.need .mono { color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips span { border: 2px solid var(--edge); border-radius: 999px; padding: 6px 11px; font-size: 14px; background: var(--card); }

/* 01 hello */
.look-hello { --bg: linear-gradient(170deg, #FFF8F1 0%, #FFE3EC 60%, #EEDFF7 100%); }
.hello { display: grid; gap: 18px; }
.hello-photo { position: relative; margin: 0; border: 3px solid var(--line); border-radius: 26px; overflow: hidden; box-shadow: 0 6px 0 var(--line); transform: rotate(-1.2deg); }
.hello-photo img { display: block; width: 100%; height: auto; }
.hello-sticker { position: absolute; top: 12px; right: 12px; background: var(--butter); border: 2px solid var(--line); border-radius: 999px; padding: 4px 10px; transform: rotate(4deg); }
.hello-head { margin: 0; }
.hello-lines p { margin: 0 0 8px; font-size: 18px; line-height: 1.5; }
.hello-lines p:first-child { font-size: 22px; font-weight: 700; }
.hello-facts { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (min-width: 900px) { .hello-facts { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.hello-facts li { border: 2px solid var(--line); border-radius: 18px; padding: 12px 10px; background: #fff; box-shadow: 0 3px 0 var(--line); }
.hello-facts b { display: block; font-family: var(--display); font-weight: 400; font-size: clamp(30px, 8vw, 52px); line-height: 1; color: var(--cherry); }
.hello-facts span { display: block; margin-top: 6px; font-size: 13px; line-height: 1.35; }
@media (min-width: 900px) { .hello { grid-template-columns: 1fr 1fr; align-items: center; column-gap: 40px; } .hello-photo { grid-row: span 3; } .hello-facts, .big-hand { grid-column: 1 / -1; } }

/* 02 client work: screening room */
.look-screening { --bg: radial-gradient(120% 60% at 50% 0%, #3A2440 0%, #1B1320 60%); --accent: #FFEBA8; }
.cw-badge { display: inline-flex; flex-direction: column; gap: 2px; padding: 10px 14px; border-radius: 16px; background: var(--cherry); color: #fff; transform: rotate(-1.5deg); margin-bottom: 14px; box-shadow: 0 4px 0 #000; }
.cw-badge .mono { font-size: 15px; letter-spacing: .2em; font-weight: 500; }
.cw-badge span:last-child { font-size: 13px; opacity: .95; }
.marquee { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 18px; }
.mq { border: 2px solid var(--accent); border-radius: 16px; padding: 10px; }
.mq b { display: block; font-family: var(--display); font-weight: 400; font-size: clamp(28px, 8vw, 50px); line-height: 1; color: var(--accent); }
.mq span { display: block; margin-top: 4px; font-size: 12.5px; line-height: 1.3; color: var(--soft); }
.now-showing { margin-bottom: 12px; }
.ns-label { margin: 0 0 8px; color: var(--accent); }
.tile.feature { border-color: var(--accent); box-shadow: 0 0 0 6px rgba(255, 235, 168, .08), 0 20px 60px rgba(0, 0, 0, .5); }
.tile.feature.v { background: #000; }
.strip { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 12px; scroll-snap-type: x mandatory; scrollbar-width: thin; }
.frame { position: relative; flex: none; width: 150px; aspect-ratio: 16 / 10; border-radius: 12px; border: 2px solid rgba(255, 255, 255, .35); overflow: hidden; scroll-snap-align: start; padding: 0; text-align: left; color: #fff; }
.frame.tall { width: 96px; aspect-ratio: 9 / 13; }
.frame.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent); }
.frame-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.frame-no { position: absolute; top: 6px; left: 6px; background: rgba(0, 0, 0, .55); border-radius: 999px; padding: 1px 7px; font-size: 11px; }
.frame-title { position: absolute; left: 0; right: 0; bottom: 0; padding: 16px 8px 6px; font-size: 12.5px; font-weight: 700; line-height: 1.15; background: linear-gradient(transparent, rgba(0, 0, 0, .75)); }
.screening-lede { font-size: 16px; line-height: 1.55; color: var(--soft); max-width: 62ch; }

/* 03 experiments: a desktop */
.look-desktop { --bg: radial-gradient(circle at 20% 20%, #CFE3FA 0 20%, transparent 21%) 0 0 / 28px 28px, linear-gradient(160deg, #DCD3F7, #FFD6E2); }
.windows { display: grid; gap: 16px; }
.win { position: relative; border: 2px solid var(--line); border-radius: 16px; background: #fff; box-shadow: 0 5px 0 var(--line); overflow: visible; }
.win .tile { border: 0; border-radius: 0 0 14px 14px; }
.win-bar { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-bottom: 2px solid var(--line); background: var(--milk); border-radius: 14px 14px 0 0; }
.win-bar i { width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid var(--line); background: #F28BA8; }
.win-bar i:nth-child(2) { background: #FFEBA8; } .win-bar i:nth-child(3) { background: #CFEFE0; }
.win-bar .mono { margin-left: 6px; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.burst { position: absolute; z-index: 3; top: 40px; right: -6px; background: var(--butter); border: 2px solid var(--line); padding: 10px 12px; font-family: var(--display); font-size: 16px; line-height: 1; transform: rotate(8deg); clip-path: polygon(50% 0, 61% 12%, 77% 6%, 80% 22%, 96% 24%, 89% 40%, 100% 52%, 88% 62%, 94% 79%, 77% 80%, 72% 96%, 57% 88%, 45% 100%, 36% 87%, 20% 94%, 18% 77%, 2% 74%, 10% 59%, 0 46%, 12% 36%, 6% 20%, 23% 19%, 28% 3%, 42% 11%); padding: 26px 20px; }
.annex-body { padding: 14px; display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
.annex-body p { margin: 0; font-size: 15px; line-height: 1.5; }
@media (min-width: 900px) { .windows { grid-template-columns: 1fr 1fr; align-items: start; } }

/* 04 the highlight: ON AIR */
.look-onair { --bg: radial-gradient(120% 70% at 50% 0%, #4A2A55 0%, #24152B 60%); --accent: #FF6B7A; }
.lamp { display: inline-flex; align-items: center; gap: 8px; margin: 0 0 12px; padding: 6px 14px; border-radius: 8px; background: #E1302A; color: #fff; font-size: 15px; letter-spacing: .2em; box-shadow: 0 0 24px rgba(225, 48, 42, .7); animation: lamp 2s ease-in-out infinite; }
.lamp i { width: 9px; height: 9px; border-radius: 50%; background: #fff; }
@keyframes lamp { 0%, 100% { box-shadow: 0 0 24px rgba(225, 48, 42, .8); } 50% { box-shadow: 0 0 6px rgba(225, 48, 42, .3); } }
.pod-hero { position: relative; aspect-ratio: 16 / 9; border-radius: 20px; overflow: hidden; border: 3px solid #fff; box-shadow: 0 20px 60px rgba(0, 0, 0, .55); margin-bottom: 10px; background: #000; }
.pod-hero iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.pod-btn { position: absolute; inset: 0; padding: 0; border: 0; background: none; display: flex; align-items: center; justify-content: center; }
.pod-thumb { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform .6s; }
.pod-btn:hover .pod-thumb { transform: scale(1.03); }
.pod-play { position: relative; width: 76px; height: 76px; border-radius: 50%; background: #E1302A; color: #fff; border: 3px solid #fff; display: flex; align-items: center; justify-content: center; font-size: 26px; padding-left: 5px; box-sizing: border-box; box-shadow: 0 8px 30px rgba(0, 0, 0, .5); }

/* 05 trophies: podium */

.song-cta { width: 100%; display: flex; align-items: center; gap: 14px; text-align: left; padding: 14px 16px; margin: 4px 0 18px; border-radius: 22px; border: 2px solid var(--line); background: var(--lilac); box-shadow: 0 4px 0 var(--line); min-height: 72px; }

.mini-disc { flex: none; width: 46px; height: 46px; border-radius: 50%; background: radial-gradient(circle, var(--cherry) 0 18%, #3A2440 19% 100%); animation: spin 3s linear infinite; }

@media (min-width: 900px) { .campus { grid-template-columns: 300px 1fr; gap: 32px; } }

/* 06 the song */
.look-vinyl { --bg: radial-gradient(circle at 50% 45%, #FFE3EC 0%, #DCD3F7 70%); }

.disc .label { position: absolute; inset: 33%; border-radius: 50%; background: var(--cherry); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 3px solid #fff; font-family: var(--display); line-height: .9; }

/* 08 design: corkboard */

.stickies { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.stickies li { background: var(--butter); padding: 12px 10px; font-family: var(--hand); font-size: 24px; box-shadow: 0 4px 8px rgba(0, 0, 0, .15); }
.stickies li:nth-child(2) { background: var(--blush); } .stickies li:nth-child(3) { background: var(--mint); } .stickies li:nth-child(4) { background: var(--sky); }

@media (min-width: 900px) { .pins { grid-template-columns: repeat(3, minmax(0, 1fr)); } .pinned:first-child { grid-column: auto; width: auto; } .stickies { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.lightbox { position: fixed; inset: 0; z-index: 20; background: rgba(30, 20, 35, .88); display: flex; align-items: center; justify-content: center; padding: 60px 16px 24px; }
.lightbox img { max-width: 100%; max-height: 100%; border-radius: 8px; }
.lightbox .x { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); right: 16px; width: 48px; height: 48px; border-radius: 50%; border: 2px solid var(--line); background: var(--blush); font-size: 22px; }

/* 09 Toppings: neon */
.look-neon { --bg: #070507; --accent: #FF7FA6; }

/* 10 Forest Listening Network */

/* 11 active research: lattice */

/* 12 side quests: festival lineup */

.poster-card { position: relative; flex: none; width: min(74vw, 300px); aspect-ratio: 2 / 3; padding: 0; border: 0; background: none; scroll-snap-align: center; transform-style: preserve-3d; transition: transform .7s cubic-bezier(.2, .9, .2, 1); color: var(--ink); text-align: left; }

/* 13 things I love: menu */

.look-stars { --bg: radial-gradient(1.5px 1.5px at 20% 30%, #fff 50%, transparent 51%) 0 0 / 120px 120px, radial-gradient(1px 1px at 70% 60%, #FFEBA8 50%, transparent 51%) 0 0 / 90px 90px, linear-gradient(180deg, #1E1A3C 0%, #3B2E66 100%); --accent: #FFEBA8; }

/* Map */
.guide { position: fixed; inset: 0; z-index: 9; background: rgba(58, 36, 64, .25); display: flex; align-items: flex-start; justify-content: flex-end;
  padding: calc(70px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }

.guide-box .sub { margin: 0; color: var(--ink-soft); }
.guide-box ol { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.guide-box li button { width: 100%; min-height: 48px; display: flex; align-items: center; gap: 10px; text-align: left; border: 2px solid var(--line); border-radius: 14px; background: #fff; padding: 6px 12px; }
.guide-box li button .mono { color: var(--cherry); width: 22px; }
.guide-box li button small { display: block; color: var(--ink-soft); font-size: 13px; }
.guide-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }

.guide-box li button .seen-tick { margin-left: auto; color: var(--cherry); font-weight: 700; }
.guide-box li button[aria-current="true"] { background: var(--butter); }

/* No-WebGL fallback page: every scene stacked */
.fallback { padding: 24px 0 64px; }
.fallback > h1 { font-family: var(--display); font-weight: 400; font-size: 48px; margin: 0; padding: 0 16px; }
.fallback > h1 em { font-style: normal; color: var(--cherry); }
.fallback > .mono { padding: 0 16px; }
.stage-static { position: relative; background: var(--bg); color: var(--fg); padding: 24px 16px; }
.stage-static .stage-scroll { overflow: visible; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } .credit { opacity: 1; } .stage { clip-path: none; } }

.site-link { display: inline-flex; margin-top: 14px; text-decoration: none; }

.poster-card { container-type: inline-size; }
.onair .pod-full { text-decoration: none; display: inline-flex; margin: 14px 0 4px; background: #E1302A; color: #fff; border-color: #fff; font-weight: 700; }
.pod-hero .pod-clip { margin: 0; }
.fest-embed { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.fest-embed .tile { width: 100%; max-width: 640px; }
.fest-embed iframe { width: 100%; max-width: 504px; height: 560px; border: 0; border-radius: 16px; background: #fff; }
.fest-embed .pill { text-decoration: none; }
